<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция вождения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #ui-overlay.active {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-overlay"></div>
    <div id="loading-screen" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;font-family:sans-serif;">
        <h2 style="margin-bottom:20px;">Загрузка города...</h2>
        <div style="width:300px;height:6px;background:#333;border-radius:3px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:#4fc3f7;transition:width 0.3s;"></div>
        </div>
        <p id="loading-text" style="margin-top:12px;font-size:14px;color:#aaa;">Инициализация...</p>
    </div>

    <!-- Babylon.js из CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <!-- Модули игровой логики -->
    <script type="module">
        import { EventBus } from './js/event-bus.js';
        import { Engine } from './js/engine.js';
        import { DriverCamera } from './js/camera.js';
        import { CarPhysics } from './js/car-physics.js';
        import { InputManager } from './js/input-manager.js';
        import { ModelLoader } from './js/model-loader.js';
        import { ScenarioManager } from './js/scenario-manager.js';
        import { UIOverlay } from './js/ui-overlay.js';
        import { DeepseekAPI } from './js/deepseek-api.js';
        import { PedestrianScenario } from './js/scenarios/pedestrian.js';
        import { CityGenerator } from './js/city-generator.js';

        async function main() {
            const loadingBar = document.getElementById('loading-bar');
            const loadingText = document.getElementById('loading-text');
            const loadingScreen = document.getElementById('loading-screen');

            function setProgress(percent, text) {
                loadingBar.style.width = percent + '%';
                loadingText.textContent = text;
            }

            setProgress(10, 'Инициализация движка...');

            // Инициализация движка
            const engine = new Engine('renderCanvas');
            await engine.initialize();
            const scene = engine.getScene();

            setProgress(20, 'Создание модулей...');

            // Инициализация модулей
            const inputManager = new InputManager();
            const carPhysics = new CarPhysics();
            const camera = new DriverCamera(scene, { x: -0.3, y: 1.2, z: 0.5 });
            const modelLoader = new ModelLoader(scene, './assets/models/', './assets/textures/');
            const scenarioManager = new ScenarioManager(EventBus, scene);
            const uiOverlay = new UIOverlay('ui-overlay', EventBus);
            const deepseekAPI = new DeepseekAPI({ endpoint: '/api/evaluate', timeout: 30000 });

            setProgress(30, 'Генерация города...');

            // Процедурная генерация города (сетка улиц, рандомизация каждый запуск)
            const cityGenerator = new CityGenerator(scene, './assets/models/', './assets/textures/');
            let cityInfo;
            try {
                cityInfo = await cityGenerator.generate({
                    gridSizeX: 4,
                    gridSizeZ: 5,
                    minBlockSize: 90,
                    maxBlockSize: 140,
                    trafficLightChance: 0.5,
                });
                console.log(`Город: ${cityInfo.intersectionCount} перекрёстков, ${cityInfo.roadCount} дорог, ${cityInfo.trafficLightCount} светофоров`);
            } catch (error) {
                console.error('Ошибка генерации города:', error);
                // Fallback — минимальная сцена
                const fallbackRoad = BABYLON.MeshBuilder.CreateGround('road', { width: 10, height: 500 }, scene);
                const fallbackMat = new BABYLON.StandardMaterial('roadMat', scene);
                fallbackMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                fallbackRoad.material = fallbackMat;
                scene.clearColor = new BABYLON.Color4(0.53, 0.81, 0.92, 1);
                new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
            }

            setProgress(90, 'Финализация...');

            EventBus.emit('models:loaded');

            // Скрытие экрана загрузки
            setProgress(100, 'Готово!');
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s';
                setTimeout(() => loadingScreen.style.display = 'none', 500);
            }, 300);

            // Регистрация сценариев
            scenarioManager.register(PedestrianScenario);

            // Связывание событий
            EventBus.on('trigger:entered', (data) => {
                const scenario = scenarioManager.getActiveScenario();
                if (scenario) {
                    uiOverlay.showScenario(scenario.description, scenario.choices);
                    inputManager.setBlocked(true);
                    carPhysics.setInputBlocked(true);
                }
            });

            EventBus.on('scenario:choiceMade', async (data) => {
                uiOverlay.showLoading();
                try {
                    const scenario = scenarioManager.getActiveScenario();
                    const response = await deepseekAPI.evaluate(scenario.description, scenario.choices[data.choiceIndex]);
                    uiOverlay.showResponse(response);
                    EventBus.emit('api:response', { text: response });
                } catch (error) {
                    uiOverlay.showError(error.message, true);
                    EventBus.emit('api:error', { error: error.message, canRetry: true });
                }
            });

            uiOverlay.onClose(() => {
                const scenario = scenarioManager.getActiveScenario();
                if (scenario) {
                    scenarioManager.completeScenario(scenario.id);
                }
                uiOverlay.hide();
                inputManager.setBlocked(false);
                carPhysics.setInputBlocked(false);
                EventBus.emit('input:unblocked');
            });

            uiOverlay.onRetry(async () => {
                uiOverlay.showLoading();
                try {
                    const scenario = scenarioManager.getActiveScenario();
                    const response = await deepseekAPI.evaluate(scenario.description, scenario.choices[0]);
                    uiOverlay.showResponse(response);
                } catch (error) {
                    uiOverlay.showError('Сервис недоступен. Попробуйте позже.', false);
                    const scenario = scenarioManager.getActiveScenario();
                    if (scenario) {
                        scenarioManager.completeScenario(scenario.id);
                    }
                    setTimeout(() => {
                        uiOverlay.hide();
                        inputManager.setBlocked(false);
                        carPhysics.setInputBlocked(false);
                    }, 3000);
                }
            });

            // Обработка принудительной остановки автомобиля (из PedestrianScenario)
            EventBus.on('car:forceStop', (data) => {
                carPhysics.forceStop(data.duration);
            });

            // Игровой цикл
            const bounds = cityGenerator.getBounds();

            engine.registerUpdateCallback((deltaTime) => {
                const input = inputManager.getInput();
                carPhysics.update(deltaTime, input);

                const carPosition = carPhysics.getPosition();
                const carRotation = carPhysics.getRotation();

                // Ограничение движения границами города
                if (carPosition.x < bounds.minX) carPhysics.position.x = bounds.minX;
                if (carPosition.x > bounds.maxX) carPhysics.position.x = bounds.maxX;
                if (carPosition.z < bounds.minZ) carPhysics.position.z = bounds.minZ;
                if (carPosition.z > bounds.maxZ) carPhysics.position.z = bounds.maxZ;

                scenarioManager.update(carPhysics.getBoundingBox());
                camera.update(carPhysics.getPosition(), carRotation);
            });

            // Запуск
            engine.start();
        }

        main().catch(console.error);
    </script>
</body>
</html>
